#
# The weekly upgrade's read-only role: build/versions.py looks new versions up with it (EKS
# Kubernetes and add-on versions, node and EC2 AMIs, Aurora engine versions). It trusts only the
# upgrade-main workflow's runs on main of this repository, through the account's GitHub OIDC
# provider. Deploy once per account (it is not part of the workshop stack):
#
#   aws cloudformation deploy --stack-name multi-az-workshop-versions-role \
#     --template-file build/versions-role.yaml --capabilities CAPABILITY_NAMED_IAM --region us-east-1
#
# then store its VersionsRoleArn output as the repo secret VERSIONS_ROLE_ARN.
AWSTemplateFormatVersion: '2010-09-09'
Description: Read-only role for the multi-az-workshop weekly version lookups
Parameters:
  Repository:
    Type: String
    Default: awslabs/multi-az-workshop
Resources:
  VersionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: multi-az-workshop-versions
      Description: Weekly version lookups for build/versions.json (read-only)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:ref:refs/heads/main
      Policies:
        - PolicyName: versions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Versions
                Effect: Allow
                Action:
                  - eks:DescribeClusterVersions
                  - eks:DescribeAddonVersions
                  - rds:DescribeDBEngineVersions
                  - ec2:DescribeImages
                Resource: '*'
              - Sid: PublicParameters
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:*::parameter/aws/service/*
Outputs:
  VersionsRoleArn:
    Value: !GetAtt VersionsRole.Arn
