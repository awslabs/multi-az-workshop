# ~~ Generated by projen. To modify, edit .projenrc.ts and run "yarn projen".

name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release to publish (v<x.y.z>); empty: the latest"
        required: false
        type: string
jobs:
  approve:
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: AWS-approval
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Approved
        id: approved
        run: echo "Approved."
  publish:
    needs: approve
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CI: "true"
      WORKSHOP_ID: ${{ vars.WORKSHOP_ID }}
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check out the release
        id: check_out_the_release
        env:
          CI: "true"
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 projenrc/cre/scripts/build/publish.py checkout
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Install dotnet
        id: install_dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: "9.0"
      - name: Build
        id: build
        env:
          BUILD_TOOL_LOCATION_LINUX: ${{ secrets.BUILD_TOOL_LOCATION_LINUX }}
          BUILD_TOOL_LOCATION_LINUX_ARM: ${{ secrets.BUILD_TOOL_LOCATION_LINUX_ARM }}
          BUILD_TOOL_LOCATION_OSX: ${{ secrets.BUILD_TOOL_LOCATION_OSX }}
          BUILD_TOOL_LOCATION_OSX_ARM: ${{ secrets.BUILD_TOOL_LOCATION_OSX_ARM }}
          BUILD_TOOL_LOCATION_WINDOWS: ${{ secrets.BUILD_TOOL_LOCATION_WINDOWS }}
          BUILD_TOOL_LOCATION_WINDOWS_ARM: ${{ secrets.BUILD_TOOL_LOCATION_WINDOWS_ARM }}
        run: npx projen build
      - name: Publish
        id: publish
        env:
          WS_ACCESS_KEY_ID: ${{ secrets.WS_ACCESS_KEY_ID }}
          WS_SECRET_ACCESS_KEY: ${{ secrets.WS_SECRET_ACCESS_KEY }}
          WS_SESSION_TOKEN: ${{ secrets.WS_SESSION_TOKEN }}
          REMOTE_REPO: ${{ secrets.REMOTE_REPO }}
          ASSETS_LOCATION: ${{ secrets.ASSETS_LOCATION }}
          GIT_PLUGIN_LOCATION: ${{ secrets.GIT_PLUGIN_LOCATION }}
          GIT_PLUGIN: ${{ secrets.GIT_PLUGIN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: npx projen publish:upload
