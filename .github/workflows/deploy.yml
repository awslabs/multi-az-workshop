name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CI: "true"
      PROJECT_NAME: multi-az-workshop
      BUILD_TOOL_LOCATION_LINUX: ${{ secrets.BUILD_TOOL_LOCATION_LINUX }}
      BUILD_TOOL_LOCATION_LINUX_ARM: ${{ secrets.BUILD_TOOL_LOCATION_LINUX_ARM }}
      BUILD_TOOL_LOCATION_OSX: ${{ secrets.BUILD_TOOL_LOCATION_OSX }}
      BUILD_TOOL_LOCATION_OSX_ARM: ${{ secrets.BUILD_TOOL_LOCATION_OSX_ARM }}
      BUILD_TOOL_LOCATION_WINDOWS: ${{ secrets.BUILD_TOOL_LOCATION_WINDOWS }}
      BUILD_TOOL_LOCATION_WINDOWS_ARM: ${{ secrets.BUILD_TOOL_LOCATION_WINDOWS_ARM }}
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Install dotnet
        id: install_dotnet
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "9.0"
      - name: Generated files are current
        id: generated_files_are_current
        run: npx projen check:generated
      - name: Build
        id: build
        run: npx projen build
      - name: Upload content artifact
        id: upload_content_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: demo-content
          path: dist/content.zip
          retention-days: 1
          if-no-files-found: error
  approve:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: AWS-approval
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Approved
        id: approved
        run: echo "Approved."
  deploy-upload:
    needs:
      - build
      - approve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: AWS
    env:
      CI: "true"
      PROJECT_NAME: multi-az-workshop
      ASSETS_PREFIX: multi-az-workshop/${{ github.run_id }}/
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Download content artifact
        id: download_content_artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: demo-content
          path: dist
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.RUNNER_ROLE_ARN || secrets.RUNNER_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-duration-seconds: 7200
      - name: Publish templates, assets and images
        id: publish_templates_assets_and_images
        env:
          CFN_EXECUTION_ROLE_ARN: ${{ vars.CFN_EXECUTION_ROLE_ARN || secrets.CFN_EXECUTION_ROLE_ARN }}
          DNS_ROLE_ARN: ${{ vars.DNS_ROLE_ARN || secrets.DNS_ROLE_ARN }}
        run: npx projen deploy:upload
  deploy-multi-az-workshop:
    needs: deploy-upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: AWS
    env:
      CI: "true"
      PROJECT_NAME: multi-az-workshop
      ASSETS_PREFIX: multi-az-workshop/${{ github.run_id }}/
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.RUNNER_ROLE_ARN || secrets.RUNNER_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-duration-seconds: 7200
      - name: Deploy multi-az-workshop
        id: deploy_multi-az-workshop
        env:
          WS_PARTICIPANT_ROLE_NAME: ${{ vars.WS_PARTICIPANT_ROLE_NAME || secrets.WS_PARTICIPANT_ROLE_NAME }}
          CFN_EXECUTION_ROLE_ARN: ${{ vars.CFN_EXECUTION_ROLE_ARN || secrets.CFN_EXECUTION_ROLE_ARN }}
          STACK_NAME: multi-az-workshop
          TEMPLATE_NAME: multi-az-workshop
          AWS_REGION: us-east-1
          OUTPUTS_PREFIX: STACK_MULTI_AZ_WORKSHOP
          OUTPUTS: ""
          ROLE_ARN: ${{ vars.CFN_EXECUTION_ROLE_ARN || secrets.CFN_EXECUTION_ROLE_ARN }}
          ASSUME_ROLE: ""
          STACK_PARAMETERS: ParticipantRoleName=${{ vars.WS_PARTICIPANT_ROLE_NAME || secrets.WS_PARTICIPANT_ROLE_NAME }}
          REQUIRED_VARS: WS_PARTICIPANT_ROLE_NAME CFN_EXECUTION_ROLE_ARN
          REQUIRED_OUTPUTS: ""
        run: npx projen deploy:stack
      - name: Upload its outputs
        id: upload_its_outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stack-outputs-deploy-multi-az-workshop
          path: dist/multi-az-workshop.env
          retention-days: 1
          if-no-files-found: error
  deploy-prune:
    needs:
      - deploy-upload
      - deploy-multi-az-workshop
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: AWS
    env:
      CI: "true"
      PROJECT_NAME: multi-az-workshop
      ASSETS_PREFIX: multi-az-workshop/${{ github.run_id }}/
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.RUNNER_ROLE_ARN || secrets.RUNNER_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-duration-seconds: 7200
      - name: Remove old deploy prefixes
        id: remove_old_deploy_prefixes
        run: npx projen deploy:prune
  teardown:
    needs:
      - deploy-upload
      - deploy-multi-az-workshop
      - deploy-prune
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: AWS
    env:
      CI: "true"
      PROJECT_NAME: multi-az-workshop
      ASSETS_PREFIX: multi-az-workshop/${{ github.run_id }}/
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.RUNNER_ROLE_ARN || secrets.RUNNER_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-duration-seconds: 7200
      - name: Delete the stacks
        id: delete_the_stacks
        run: npx projen teardown
