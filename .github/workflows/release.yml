# ~~ Generated by projen. To modify, edit .projenrc.ts and run "yarn projen".

name: release
on:
  workflow_run:
    workflows:
      - deploy
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - content/**
      - static/**
      - contentspec.yaml
  workflow_dispatch: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
    env:
      CI: "true"
      PROJECT_NAME: multi-az-workshop
      CRE_RELEASE_TRIGGER: ${{ github.event_name == 'workflow_run' && 'deploy' || github.event_name == 'push' && 'guide' || 'manual' }}
      CRE_RELEASE_IGNORE: content/** static/** contentspec.yaml docs/** *.md
      CRE_RELEASE_PATHS: content/** static/** contentspec.yaml src/** cre-constructs/** build/versions.json package.json yarn.lock
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (!(github.event_name == 'workflow_run') && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: The last commit a deploy tested
        id: the_last_commit_a_deploy_tested
        if: "!(github.event_name == 'workflow_run')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          echo "CRE_DEPLOYED_SHA=$sha" >> "$GITHUB_ENV"
      - name: Decide
        id: release_check
        run: npx projen release --check
      - name: Download the deploy run's content artifact
        id: download_the_deploy_run_s_content_artifact
        if: steps.release_check.outputs.release == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: content
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install dotnet
        id: install_dotnet
        if: steps.release_check.outputs.release == 'true' && !(github.event_name == 'workflow_run')
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: "9.0"
      - name: Build
        id: build
        if: steps.release_check.outputs.release == 'true' && !(github.event_name == 'workflow_run')
        env:
          BUILD_TOOL_LOCATION_LINUX: ${{ secrets.BUILD_TOOL_LOCATION_LINUX }}
          BUILD_TOOL_LOCATION_LINUX_ARM: ${{ secrets.BUILD_TOOL_LOCATION_LINUX_ARM }}
          BUILD_TOOL_LOCATION_OSX: ${{ secrets.BUILD_TOOL_LOCATION_OSX }}
          BUILD_TOOL_LOCATION_OSX_ARM: ${{ secrets.BUILD_TOOL_LOCATION_OSX_ARM }}
          BUILD_TOOL_LOCATION_WINDOWS: ${{ secrets.BUILD_TOOL_LOCATION_WINDOWS }}
          BUILD_TOOL_LOCATION_WINDOWS_ARM: ${{ secrets.BUILD_TOOL_LOCATION_WINDOWS_ARM }}
        run: npx projen build
      - name: Release token (the CRE automation App)
        id: release_token
        if: steps.release_check.outputs.release == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.PROJEN_APP_ID }}
          private-key: ${{ secrets.PROJEN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - name: Tag and release
        id: tag_and_release
        if: steps.release_check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: npx projen release
