# ~~ Generated by projen. To modify, edit .projenrc.ts and run "yarn projen".

name: teardown
on:
  workflow_dispatch: {}
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: AWS-approval
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Approved
        id: approved
        run: echo "Approved."
  teardown:
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: AWS
    env:
      CI: "true"
      PROJECT_NAME: multi-az-workshop
      BUILD_TOOL_LOCATION_LINUX: ${{ secrets.BUILD_TOOL_LOCATION_LINUX }}
      BUILD_TOOL_LOCATION_LINUX_ARM: ${{ secrets.BUILD_TOOL_LOCATION_LINUX_ARM }}
      BUILD_TOOL_LOCATION_OSX: ${{ secrets.BUILD_TOOL_LOCATION_OSX }}
      BUILD_TOOL_LOCATION_OSX_ARM: ${{ secrets.BUILD_TOOL_LOCATION_OSX_ARM }}
      BUILD_TOOL_LOCATION_WINDOWS: ${{ secrets.BUILD_TOOL_LOCATION_WINDOWS }}
      BUILD_TOOL_LOCATION_WINDOWS_ARM: ${{ secrets.BUILD_TOOL_LOCATION_WINDOWS_ARM }}
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Enable Corepack
        id: enable_corepack
        run: corepack enable
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.RUNNER_ROLE_ARN || secrets.RUNNER_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-duration-seconds: 7200
      - name: Delete the stacks
        id: delete_the_stacks
        run: npx projen teardown
